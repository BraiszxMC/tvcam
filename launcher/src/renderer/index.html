<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' https://cdn.discordapp.com data:; style-src 'self'; script-src 'self';" />
  <title>TVCam Launcher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-phase="loading">

  <!-- Fondo: capas de lapislazuli que derivan muy despacio y muy poco.
       .parallax se desplaza unos pocos px siguiendo el puntero. -->
  <div class="backdrop" aria-hidden="true">
    <div class="parallax" data-parallax="18">
      <span class="field field-deep"></span>
      <span class="field field-warm"></span>
      <span class="field field-cool"></span>
    </div>
    <span class="beam"></span>
    <span class="noise"></span>
    <span class="vignette"></span>
  </div>

  <header class="titlebar">
    <div class="titlebar-name">TVCam&nbsp;<span>Launcher</span></div>
    <div class="titlebar-buttons">
      <button id="btn-minimize" class="win-btn" title="Minimizar" aria-label="Minimizar">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8" /></svg>
      </button>
      <button id="btn-close" class="win-btn win-btn-close" title="Cerrar" aria-label="Cerrar">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" /></svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <section class="card">
      <!-- Reflejo que sigue al puntero: la luz que engancha el cristal -->
      <span class="card-specular" aria-hidden="true"></span>
      <span class="card-edge" aria-hidden="true"></span>

      <div class="card-body">
        <div class="mark" data-reveal="1">
          <span class="mark-tilt">
            <span class="mark-face">
              <span class="mark-cube"></span>
              <span class="mark-sweep"></span>
            </span>
          </span>
        </div>

        <h1 class="title" data-reveal="2">TVCam Launcher</h1>
        <p class="sub" data-reveal="3" id="studio-line">Estudio de eventos</p>

        <p class="lede" data-reveal="4">Inicia sesion con Discord para continuar.</p>

        <div class="slot" data-reveal="5">
          <button id="btn-discord" class="discord-btn">
            <span class="discord-btn-glow" aria-hidden="true"></span>
            <span class="discord-btn-inner">
              <svg class="discord-logo" viewBox="0 0 24 18" aria-hidden="true">
                <path d="M20.32 1.51A19.8 19.8 0 0 0 15.43 0l-.24.44c1.63.4 2.9 1 4.1 1.76a13.9 13.9 0 0 0-11.3-.44c.4-.15.83-.29 1.27-.4l-.2-.36A19.8 19.8 0 0 0 3.68 1.5C.6 6.1-.24 10.57.18 14.98a19.9 19.9 0 0 0 6.05 3.02l1.2-1.9c-.66-.24-1.3-.54-1.9-.9l.47-.35a14.2 14.2 0 0 0 12.1 0l.46.35c-.6.36-1.23.66-1.9.9l1.2 1.9a19.9 19.9 0 0 0 6.06-3.02c.5-5.1-.85-9.53-3.6-13.47ZM8.02 12.33c-1.18 0-2.15-1.08-2.15-2.4 0-1.33.95-2.41 2.15-2.41 1.2 0 2.17 1.09 2.15 2.4 0 1.33-.95 2.41-2.15 2.41Zm7.96 0c-1.18 0-2.15-1.08-2.15-2.4 0-1.33.95-2.41 2.15-2.41 1.2 0 2.17 1.09 2.15 2.4 0 1.33-.95 2.41-2.15 2.41Z" />
              </svg>
              <span class="discord-btn-label">Iniciar sesion con Discord</span>
            </span>
          </button>

          <!-- La cuenta ocupa el mismo sitio que el boton: entra donde el otro sale -->
          <div class="account" id="account">
            <span class="account-avatar-ring">
              <img class="account-avatar" id="account-avatar" alt="" />
            </span>
            <span class="account-text">
              <strong id="account-name"></strong>
              <span id="account-tag"></span>
            </span>
            <svg class="account-check" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3.5 8.5l3 3 6-7" />
            </svg>
          </div>
        </div>

        <p class="status" id="status" role="status" data-reveal="6"></p>
      </div>

      <span class="card-progress" id="progress" aria-hidden="true"></span>
    </section>

    <footer class="foot" data-reveal="7">
      <span id="version">beta</span>
      <span class="foot-dot" aria-hidden="true"></span>
      <span>No oficial &middot; no afiliado a Mojang ni a Microsoft</span>
    </footer>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
