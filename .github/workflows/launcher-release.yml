name: Launcher release

# Publica una release con los instaladores del launcher. Se dispara al
# empujar un tag launcher-v*, por ejemplo:
#
#   git tag launcher-v0.1.0-beta
#   git push origin launcher-v0.1.0-beta
#
# La release queda en https://github.com/BraiszxMC/tvcam/releases y sus
# ficheros son el link de descarga permanente.

on:
  push:
    tags:
      - 'launcher-v*'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/launcher.yml

  release:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Crear la release con los instaladores
        uses: softprops/action-gh-release@v2
        with:
          name: TVCam Launcher ${{ github.ref_name }}
          body: |
            Build automatica del launcher del estudio.

            - **Windows**: descarga el `.exe` y ejecutalo.
            - **Linux**: descarga el `.AppImage`, dale permisos de ejecucion (`chmod +x`) y abrelo.

            Version muy beta: de momento solo el menu de inicio de sesion con Discord.
          files: artifacts/**/*
          fail_on_unmatched_files: true
